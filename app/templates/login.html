<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन - आय प्रमाण पत्र सहायक</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded shadow max-w-md w-full">
        <h1 class="text-xl font-bold mb-4">आय प्रमाण पत्र – अधिकारी सहायक</h1>
        <h2 class="mb-4">लॉगिन</h2>
        {% if error %}<p class="text-red-600 mb-2">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
            <label class="block mb-2">यूज़रनेम
                <input name="username" class="border p-2 w-full" required>
            </label>
            <label class="block mb-2">पासवर्ड
                <input type="password" name="password" class="border p-2 w-full" required>
            </label>
            <button class="bg-blue-600 text-white px-4 py-2 mt-2">लॉगिन करें</button>
        </form>
    </div>
</body>
</html>
